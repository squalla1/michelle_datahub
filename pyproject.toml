[project]
name = "michelle-datahub"
version = "0.1.0"
description = "Catalog-driven ingestion engine + REST API for the Michelle multi-category data-source registry"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "apscheduler>=3.10",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "openpyxl>=3.1",
    "feedparser>=6.0",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
datahub = "datahub.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["datahub*"]
