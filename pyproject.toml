[project]
name = "michelle-datahub"
version = "0.1.0"
description = "Multi-source intelligence data hub: continuously ingests news, global events, calendars, company, market and macro data from 1200+ sources, with scheduled fetching, dedup storage, and per-type daily REST APIs. 多源情报数据中台:持续聚合新闻、全球事件、日历、公司、市场、宏观等 1200+ 数据源,定时抓取、排重入库,按类型提供每日数据 REST 接口。"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "apscheduler>=3.10",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "openpyxl>=3.1",
    "feedparser>=6.0",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
datahub = "datahub.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["datahub*"]
