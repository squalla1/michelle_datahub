# Michelle DataHub — API + scheduler worker, against a managed PostgreSQL
# (e.g. Alibaba Cloud RDS). No bundled database.
#
# The DB connection comes from the project root .env (DATAHUB_DATABASE_URL):
#
#   cp .env.example .env        # project root; set DATAHUB_DATABASE_URL
#   cd deploy
#   docker compose run --rm ingest        # once: create tables + load registry
#   docker compose up -d api scheduler

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  env_file: ../.env
  environment: &app-env
    DATAHUB_CATALOG_PATH: /data/Michelle_Datasource_2026-06-02.xlsx
  volumes:
    - ../data:/data:ro

services:
  # One-shot: create tables (idempotent) + parse the Excel registry into the DB.
  ingest:
    <<: *app
    command: ["sh", "-c", "datahub init-db && datahub ingest"]
    restart: "no"

  # REST API only — the dedicated scheduler worker owns all fetching.
  api:
    <<: *app
    environment:
      <<: *app-env
      DATAHUB_API_SCHEDULER: "0"
    command: ["datahub", "serve"]
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Scheduler: per-source 频率 jobs + the global 2-hour refresh.
  # Refresh stats reports land on the host in ../reports.
  scheduler:
    <<: *app
    command: ["datahub", "schedule"]
    volumes:
      - ../data:/data:ro
      - ../reports:/app/reports
    restart: unless-stopped
