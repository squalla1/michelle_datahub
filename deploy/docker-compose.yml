# Michelle DataHub — full stack: PostgreSQL + API + scheduler worker.
#
#   cd deploy && docker compose up -d db        # start Postgres
#   docker compose run --rm ingest              # init schema + load the registry (once)
#   docker compose up -d api scheduler          # serve API + run the 2h refresh loop
#
# The Excel registry lives at ../data/Michelle_Datasource_*.xlsx (mounted into /data).

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  environment: &app-env
    DATAHUB_DATABASE_URL: postgresql+psycopg://datahub:${POSTGRES_PASSWORD:-datahub}@db:5432/datahub
    DATAHUB_CATALOG_PATH: /data/Michelle_Datasource_2026-06-02.xlsx
    DATAHUB_REFRESH_ALL_HOURS: ${DATAHUB_REFRESH_ALL_HOURS:-2}
  volumes:
    - ../data:/data:ro
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: datahub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datahub}
      POSTGRES_DB: datahub
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datahub -d datahub"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create schema (create_all) + parse the Excel registry into the DB.
  ingest:
    <<: *app
    command: ["sh", "-c", "datahub init-db && datahub ingest"]
    restart: "no"

  # REST API only — scheduler disabled here; the dedicated worker owns it.
  api:
    <<: *app
    environment:
      <<: *app-env
      DATAHUB_API_SCHEDULER: "0"
    command: ["datahub", "serve"]
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Standalone scheduler: per-source 频率 jobs + the global 2-hour refresh.
  scheduler:
    <<: *app
    command: ["datahub", "schedule"]
    restart: unless-stopped

volumes:
  pgdata:
