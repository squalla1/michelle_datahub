# Michelle DataHub — nginx reverse proxy.
#
# Install:  cp deploy/nginx.conf /etc/nginx/conf.d/datahub.conf
#           vi /etc/nginx/conf.d/datahub.conf   # set server_name
#           nginx -t && systemctl reload nginx
#
# Pair with the app listening on loopback only:
#   systemd: DATAHUB_API_HOST=127.0.0.1 in .env
#   docker:  ports "127.0.0.1:8000:8000" (compose default here)
#
# HTTPS: run `certbot --nginx -d your.domain` after this works on port 80.

upstream datahub_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;                      # ← 改成你的域名,如 datahub.example.com

    # API 返回 JSON,压缩收益大
    gzip on;
    gzip_types application/json;
    gzip_min_length 1k;

    # 调度控制接口只允许本机/内网访问(API 本身无鉴权)
    location /api/v1/jobs {
        allow 127.0.0.1;
        # allow 10.0.0.0/8;             # 按需放行运维网段
        deny all;
        proxy_pass http://datahub_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://datahub_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # POST /api/v1/sources/{id}/fetch 是同步抓取(含外网请求),放宽读超时
        proxy_read_timeout 90s;
    }
}
