# Michelle DataHub — nginx reverse proxy (host-installed nginx, API in Docker
# published on the host loopback 127.0.0.1:8000).
#
# Install:  cp deploy/nginx.conf /etc/nginx/conf.d/datahub.conf
#           mkdir -p /etc/nginx/cert && cp polarisagi.com.{pem,key} /etc/nginx/cert/
#           chmod 600 /etc/nginx/cert/polarisagi.com.key
#           nginx -t && systemctl reload nginx
#
# Note: `http2 on;` needs nginx >= 1.25.1; on older versions use
# `listen 443 ssl http2;` instead. The Alibaba Cloud certificate is renewed
# manually — replace the two files and reload when it expires.

upstream datahub_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name mai.polarisagi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mai.polarisagi.com;

    ssl_certificate     /etc/nginx/cert/polarisagi.com.pem;
    ssl_certificate_key /etc/nginx/cert/polarisagi.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # API 全是 JSON,压缩收益大
    gzip on;
    gzip_types application/json;
    gzip_min_length 1k;

    # 调度控制接口只允许本机访问(API 本身无鉴权)
    location /api/v1/jobs {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://datahub_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://datahub_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # POST /api/v1/sources/{id}/fetch 是同步抓取(含外网请求),放宽读超时
        proxy_read_timeout 90s;
    }
}
